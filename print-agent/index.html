<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wheelhouse Print Agent</title>
<style>
  :root {
    --bg: #f4f5f3;
    --panel: #ffffff;
    --ink: #1c231f;
    --muted: #6b7570;
    --border: #e0e2dd;
    --accent: #1f6f5c;
    --accent-dark: #164f42;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
  }
  .topbar {
    background: var(--accent-dark); color: #fff;
    padding: 14px 20px; display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px;
  }
  .topbar .logo { font-size: 18px; }
  main { flex: 1; padding: 22px 24px; overflow-y: auto; }

  form { display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  input {
    padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #fff;
    font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--ink); }
  button.ghost:hover { background: var(--bg); }

  .error { color: var(--danger); font-size: 13px; margin: 0; }
  .intro { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  .status-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .status-row .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
  .status-row .row span:first-child { color: var(--muted); }
  .status-row .row span:last-child { font-weight: 600; text-align: right; }
</style>
</head>
<body>
  <div class="topbar"><span class="logo">🚲</span> Wheelhouse Print Agent</div>
  <main id="main">Loading…</main>
  <script src="renderer.js"></script>
</body>
</html>
