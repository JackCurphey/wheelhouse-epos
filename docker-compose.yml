services:
  postgres:
    image: postgres:16-alpine
    environment:
      # POSTGRES_USER is the bootstrap Postgres SUPERUSER - kept separate
      # from the app's own epos_app role (created by docker/init-db.sh) on
      # purpose, since superusers always bypass Row-Level Security. Nothing
      # in the app ever connects as this user.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: epos
      EPOS_APP_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - epos_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      # Host port 5433, not 5432 - the native Postgres Windows service
      # installed earlier is still running on 5432 as the rollback path and
      # deliberately left alone. The app itself never uses this mapping
      # anyway (it reaches this container as "postgres:5432" over the
      # compose network) - it's only here for host-side psql/tooling access.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d epos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://epos_app:${POSTGRES_PASSWORD}@postgres:5432/epos
      PORT: 4000
      # Safe here, and only here: the app is reached through the gateway,
      # which overwrites x-forwarded-for from the real socket and drops
      # whatever the caller sent (see server/gateway.js). Without this the
      # app sees only the gateway's address and every client shares one
      # rate-limit bucket. Do not set it where the app is reachable
      # directly - it would let a caller pick its own rate-limit key.
      TRUST_PROXY: '1'
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    volumes:
      # Workshop job attachments (server.js's UPLOADS_DIR) - a named volume
      # so they survive an image rebuild, same reasoning as epos_pgdata.
      # Only the app container touches files directly; gateway just proxies
      # HTTP to it, so it doesn't need this mount.
      - epos_uploads:/app/uploads
    # Deliberately no published port. The app is reachable only from inside
    # the compose network, via the gateway on 8080 - which is what makes
    # TRUST_PROXY above safe. Publishing 4000 to the host would reopen the
    # bypass: anything that can reach the app directly can set its own
    # x-forwarded-for and pick its own rate-limit key. The gateway proxies
    # everything through transparently, so 8080 is a full substitute.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    build: .
    command: ["node", "server/gateway.js"]
    depends_on:
      - app
    environment:
      # Reaches the app by its service name on the compose network, not
      # 127.0.0.1 - see the APP_HOST fix in server/gateway.js.
      APP_HOST: app
      APP_PORT: 4000
      GATEWAY_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  epos_pgdata:
  epos_uploads:
