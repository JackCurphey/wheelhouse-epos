schema: spec-driven

# Project context: constraints an agent cannot infer from the code.
# The full rules are in CLAUDE.md; this is what every proposal must respect.
context: |
  Wheelhouse is a till, workshop and website system for independent UK bike
  shops. Jack Curphey owns it; Mark Curphey builds with him. Jack is not a
  programmer: write proposals, specs and tasks in plain English, and spell
  out anything a shop owner wouldn't know.

  Two people build at once (docs/superpowers/plans/2026-10-04-release-2-two-person-split.md):
  Mark owns the server half of each work package and all hosting; Jack owns
  the screens and the whole workshop. Each file has one owner (§3); say whose
  lane a change is in.

  Jack's decisions in docs/decisions/ are never reopened. A change cites the
  decisions and drawings it follows; anything that would contradict one stops
  and asks Jack. The drawings (docs/design/user-journeys/generator/, screen
  ids in journeys.mjs) are the design authority; where they are silent, follow
  the closest built pattern and log it in docs/decisions/decided-while-building.md.

  Never invent data: example data comes from the drawings; unknowns stay as
  bracketed placeholders like [n]. There is no official Wheelhouse logo.

  Outside services (payments, email, sign-in, WhatsApp, accounts software,
  Lightspeed, Citrus Lime) sit behind an adapter with a pretend version until
  Jack says yes to a real account.

rules:
  proposal:
    - Name the work package (e.g. WP-1.3) and whose lane it is in
    - List the drawings (screen ids) and decisions it follows, with file paths
    - State what is out of scope
  specs:
    - Describe behaviour a shop owner would recognise; one requirement per behaviour
    - Example names, prices and wording come from the drawings, never invented
  tasks:
    - Tests first, each watched failing for the right reason before the code
    - Keep each pull request to about 250-600 changed lines
    - End with npm test and npm run test:browser passing, and a fresh review
