<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Button</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap"><style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:16px}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2)}
button{min-height:44px;padding:0 18px;border-radius:var(--radius-md);font:600 15px/1 var(--font-sans);cursor:pointer}
.p{background:var(--primary);color:var(--primary-foreground);border:1px solid var(--primary)}
.o{background:var(--card);color:var(--foreground);border:1px solid var(--input)}
.g{background:transparent;color:var(--foreground);border:1px solid transparent}
.d{background:var(--destructive);color:var(--card);border:1px solid var(--destructive)}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style></head><body><div class="row"><button type="button" class="p">Take payment</button><button type="button" class="o">Save draft</button><button type="button" class="g">Cancel</button><button type="button" class="d">Void sale</button></div></body></html>
