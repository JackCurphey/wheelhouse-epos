<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Badge</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap"><style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:16px}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2)}
span{display:inline-flex;padding:3px 10px;border-radius:var(--radius-pill);font:600 12px/18px var(--font-sans)}
.a{background:var(--status-pending-bg);color:var(--status-pending-ink)}
.b{background:var(--status-scheduled-bg);color:var(--status-scheduled-ink)}
.c{background:var(--status-waiting-bg);color:var(--status-waiting-ink)}
.d{background:var(--status-hold-bg);color:var(--status-hold-ink)}
.e{background:var(--status-complete-bg);color:var(--status-complete-ink)}
</style></head><body><div class="row"><span class="a">Awaiting confirmation</span><span class="b">Booked in</span><span class="c">Waiting for parts</span><span class="d">On hold</span><span class="e">Ready</span></div></body></html>
