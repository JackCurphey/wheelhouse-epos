name: Tests

on:
  push:
    # Both names on purpose, while the default branch is being renamed from
    # master to main. Renaming needs repo admin, so it may land at any time
    # or not for a while; listing both means the push trigger keeps firing
    # either side of it and nothing has to be timed. Drop master once the
    # rename is done.
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Mirrors docker-compose.yml: this bootstrap user is a Postgres
          # SUPERUSER and superusers bypass RLS, so the app (and therefore
          # the test suite) must never connect as it. The epos_app role
          # created below is what DATABASE_URL points at.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-pw
          POSTGRES_DB: epos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d epos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://epos_app:ci-epos-app-pw@127.0.0.1:5432/epos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Runs the real bootstrap script rather than a copy of its SQL, so CI
      # fails if it ever loses its executable bit again (it was committed
      # 100644 once, which made the compose bootstrap fail silently while
      # the container still reported healthy).
      - name: Create the epos_app role
        run: ./docker/init-db.sh
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: epos
          EPOS_APP_PASSWORD: ci-epos-app-pw
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGPASSWORD: ci-superuser-pw

      - name: Fail if the app role is a superuser
        run: |
          test "$(psql "$DATABASE_URL" -tAc 'SELECT rolsuper FROM pg_roles WHERE rolname = current_user')" = "f"

      - run: npm ci

      # ---------- Front-end build and static analysis ----------
      # Cheap and independent of Postgres, so they run before the database
      # steps: a type error should not wait on migrations to be reported.

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      # ---------- Design system ----------

      - name: Validate the registry
        run: npm run registry:validate

      # shadcn components are ordinary editable files, so the registry only
      # stays truthful if something checks. See the header comment in the
      # script for why this rebuilds rather than using `shadcn add --diff`.
      - name: Fail if the registry is out of date
        run: node scripts/ci/check-registry-drift.mjs

      # ---------- Atlas ----------

      # The 82-screen journey atlas is generated from screens.js, not written by
      # hand, and it is what Phase 4 builds against. Until now these three ran
      # only on someone's machine, so a green CI said nothing about whether the
      # atlas was still valid - #54 merged exactly that way.
      #
      # Both checks genuinely fail: breaking a destination in screens.js makes
      # check-static exit 1 with "Broken action", and removing the service
      # template wording makes check-notes exit 1 naming the note it broke.
      # Verified by doing both, 20 Sep, before adding them here.
      - name: Rebuild the atlas
        run: python3 docs/design/release-1-journey/package.py

      - name: Check the atlas is valid
        run: node docs/design/release-1-journey/check-static.mjs

      - name: Check every review note is still applied
        run: node docs/design/release-1-journey/check-notes.mjs

      # package.py regenerates the HTML and check-static regenerates
      # screen-index.json, so if either differs from what is committed, the
      # committed atlas was edited by hand or generated from a since-changed
      # source. Both are the thing the "never hand-edit the atlas HTML" rule
      # exists to stop, and neither is visible any other way.
      # Scoped to the three generated artefacts rather than the whole folder, so
      # this reports a stale atlas and never a source file someone is editing.
      - name: Fail if the committed atlas is out of date
        run: |
          if ! git diff --exit-code -- \
            docs/design/release-1-journey/Wheelhouse-Release-1-Journey-Atlas.html \
            docs/design/release-1-journey/screen-index.json \
            docs/design/release-1-journey/verification.json; then
            echo "::error::The committed atlas does not match what its source generates. Run package.py and check-static.mjs locally and commit the result."
            exit 1
          fi

      # ---------- Atlas traceability ----------

      # The Release 1 design's one rule for the API layer: every workshop
      # endpoint names the atlas screen it serves, and an endpoint no screen
      # consumes is not built. Static, so it runs with the other cheap checks,
      # before Postgres is involved.
      - name: Assert every workshop route names a screen
        run: node scripts/ci/assert-screen-trace.mjs

      # ---------- Database ----------

      - run: npm run migrate

      # Tenant isolation is enforced by Postgres RLS rather than by
      # application code, so a migration that adds a shop-scoped table and
      # forgets its policy is invisible to every functional test. Checked
      # against the live catalogue, after migrations, for that reason.
      - name: Assert RLS covers every shop-scoped table
        run: node scripts/ci/assert-rls-coverage.mjs

      - run: npm test

      # The real bundle on the real server in a real browser: the only layer
      # that catches a screen wired to the wrong endpoint or dropping the
      # version echo. The config builds and starts its own server on 8091.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Journey tests
        run: npm run test:browser

      # A second migrate must be a no-op. run-migrations.js skips anything
      # already recorded in schema_migrations, so re-applying means a
      # migration ran without being recorded, or a committed migration file
      # was renamed after it shipped - both of which diverge deployed
      # databases from fresh ones.
      - name: Migrations are idempotent
        run: |
          set -o pipefail
          out=$(npm run migrate 2>&1)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'Applied migration:'; then
            echo "::error::A second 'npm run migrate' re-applied migrations; they are not idempotent."
            exit 1
          fi
