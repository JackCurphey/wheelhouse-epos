name: Board

# The build board fills itself in (Jack, issue #669 change 4). Every night at
# 02:30 UTC, half an hour before the daily Tests run, this adds a "done" row to
# docs/build-progress/build-board.html for each pull request merged since the
# last one on the board, and opens a small pull request with the change. If
# nothing new has merged it exits quietly. Nothing merges itself: a person
# reads the pull request and merges it. The "who is on what" lines, the lead
# and the asks stay hand-written. Also runnable by hand (Actions › Board ›
# Run workflow). The script: scripts/board/update-board.mjs.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

# One run at a time, so two never open the same pull request.
concurrency:
  group: board
  cancel-in-progress: false

jobs:
  board:
    # Only this repository: a fork's copy of this workflow does nothing.
    if: github.repository == 'JackCurphey/wheelhouse-epos'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fill in the board
        id: board
        run: node scripts/board/update-board.mjs

      - name: Open a pull request
        if: steps.board.outputs.changed == 'true'
        env:
          HIGHEST: ${{ steps.board.outputs.highest }}
        run: |
          DAY=$(date -u +%Y-%m-%d)
          BRANCH="bot/board-$DAY"
          # An earlier run today may already have opened this branch.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists; leaving it for a person."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/build-progress/build-board.html
          git commit -m "Board: merged up to #$HIGHEST ($DAY)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Board: merged up to #$HIGHEST ($DAY)" \
            --body "Added by the nightly board run (scripts/board/update-board.mjs): a done row for each pull request merged since the last one on the board, and today's date. Nothing else on the board is touched. The \"Merged ...\" line (sub) and the lead are hand-written and still need a person if they are out of date. Merge it if it looks right."
